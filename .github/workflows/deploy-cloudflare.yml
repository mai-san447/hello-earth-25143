name: Deploy Cloudflare Worker

# 本番の公開は、作者の PC から手動で行っている（npm run build → npx wrangler deploy）。
# リポジトリに Cloudflare の鍵を登録していないため、main への push では動かさず、手動で起動したときだけ動かす（Issue #9）
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc