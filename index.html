<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10152f">
  <meta name="description" content="25143から、未来の自分へ帰る声を預ける。">
  <title>25143 | HELLO EARTH</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310152f'/%3E%3Cpath d='M32 10l4.2 17.8L54 32l-17.8 4.2L32 54l-4.2-17.8L10 32l17.8-4.2z' fill='%23ff8b66'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; --ink:#f9f6f1; --night:#10152f; --night-2:#1c2450; --mist:#cbd4fb; --coral:#ff8b66; --sun:#ffc461; --line:rgba(255,255,255,.17); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100dvh; color:var(--ink); font-family:"Yu Gothic UI","Hiragino Sans",system-ui,sans-serif; background:radial-gradient(circle at 10% 4%,#38467c 0,transparent 27rem),radial-gradient(circle at 90% 94%,#672f57 0,transparent 30rem),var(--night); }
    button, input { font:inherit; }
    button { cursor:pointer; }
    .app { width:min(100%, 720px); min-height:100dvh; margin:auto; padding:24px 20px 30px; display:flex; flex-direction:column; gap:24px; overflow:hidden; }
    .topbar { display:flex; justify-content:space-between; align-items:center; font-size:.8rem; letter-spacing:.11em; color:var(--mist); }
    .brand { color:var(--ink); font-weight:700; }
    .stage { position:relative; min-height:290px; padding:32px 24px 28px; border:1px solid var(--line); border-radius:30px; background:linear-gradient(145deg,rgba(39,50,104,.82),rgba(15,20,47,.94)); box-shadow:0 24px 80px rgba(0,0,0,.25); overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; }
    .stage::before, .stage::after { content:""; position:absolute; width:3px; height:3px; border-radius:50%; background:#fff; box-shadow:48px 26px #fff, 110px -8px #fff, 166px 43px #fff, 232px 16px #fff, 304px 73px #fff, 380px 11px #fff, 432px 63px #fff, 520px 28px #fff, 598px 96px #fff; opacity:.72; }
    .stage::before { top:45px; left:7px; } .stage::after { top:111px; left:42px; opacity:.35; transform:scale(.7); }
    .eyebrow { position:relative; z-index:1; margin:0 0 8px; color:var(--sun); font-size:.82rem; font-weight:700; letter-spacing:.12em; }
    h1 { position:relative; z-index:1; margin:0; font-size:clamp(2.7rem,11vw,5.25rem); line-height:.91; letter-spacing:-.06em; }
    .lead { position:relative; z-index:1; max-width:29rem; margin:18px 0 0; color:#e9edff; line-height:1.75; }
    .capsule { position:absolute; top:42px; right:11%; width:78px; height:116px; border:3px solid rgba(255,255,255,.9); border-radius:48% 48% 42% 42%; background:linear-gradient(120deg,var(--coral),#d34e75); box-shadow:inset -11px -12px 18px rgba(73,11,59,.26),0 0 45px rgba(255,139,102,.28); transform:rotate(19deg); transition:transform 1.15s cubic-bezier(.2,.85,.2,1), top 1.15s cubic-bezier(.2,.85,.2,1), box-shadow .6s; }
    .capsule::after { content:"25143"; position:absolute; inset:42px 8px auto; color:#3e1738; font-size:.73rem; font-weight:800; letter-spacing:.04em; transform:rotate(-19deg); }
    .capsule.arrived { top:158px; transform:rotate(-6deg) scale(1.08); box-shadow:0 0 0 14px rgba(255,196,97,.15),0 0 70px rgba(255,139,102,.8); }
    .card { border:1px solid var(--line); border-radius:24px; padding:21px; background:rgba(9,13,35,.52); }
    label { display:block; margin:0 0 9px; font-size:.9rem; font-weight:700; }
    input { width:100%; border:1px solid rgba(255,255,255,.28); border-radius:13px; padding:14px 15px; color:var(--ink); background:rgba(255,255,255,.08); outline:none; }
    input:focus { border-color:var(--sun); box-shadow:0 0 0 3px rgba(255,196,97,.17); }
    .hint { margin:9px 0 0; color:var(--mist); font-size:.8rem; line-height:1.5; }
    .record-row { display:flex; align-items:center; gap:12px; margin-top:20px; }
    .round { width:57px; height:57px; flex:0 0 auto; border:0; border-radius:50%; color:#411a38; background:var(--coral); font-size:1.2rem; font-weight:800; box-shadow:0 6px 22px rgba(255,139,102,.25); }
    .round.is-recording { animation:pulse 1s infinite; background:#ff6363; color:white; }
    @keyframes pulse { 50% { transform:scale(1.08); box-shadow:0 0 0 12px rgba(255,99,99,.14); } }
    .record-copy strong { display:block; } .record-copy span { display:block; margin-top:3px; color:var(--mist); font-size:.82rem; }
    .return { border:0; border-radius:15px; padding:16px 18px; color:#36203a; background:linear-gradient(135deg,var(--sun),#ff9b70); font-weight:800; letter-spacing:.03em; box-shadow:0 8px 30px rgba(255,183,97,.22); }
    .return:disabled { opacity:.44; cursor:not-allowed; }
    .return-row { display:flex; gap:12px; align-items:center; margin-top:20px; }
    .fallback { border:1px solid var(--line); border-radius:15px; padding:14px 13px; color:var(--ink); background:transparent; font-size:.88rem; }
    .status { min-height:1.4em; margin:14px 0 0; color:var(--mist); font-size:.9rem; line-height:1.55; }
    .returned { display:none; padding:18px; border-radius:18px; background:rgba(255,196,97,.13); border:1px solid rgba(255,196,97,.35); }
    .returned.show { display:block; }
    .returned p { margin:0 0 12px; line-height:1.6; }
    .play { width:100%; border:0; border-radius:13px; padding:14px; color:var(--night); background:var(--ink); font-weight:800; }
    footer { margin-top:auto; color:var(--mist); font-size:.76rem; line-height:1.55; }
    @media (min-width:700px) { .app { padding-top:36px; } .stage { min-height:332px; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><span class="brand">HELLO EARTH</span><span>RETURN CAPSULE / 25143</span></header>
    <section class="stage" aria-labelledby="title">
      <div class="capsule" id="capsule" aria-hidden="true"></div>
      <p class="eyebrow">SMALL WISHES, RETURNED</p>
      <h1 id="title">25143</h1>
      <p class="lead">すぐには戻れない場所へ行く前に。<br>いまの願いを、未来の自分へ預けよう。</p>
    </section>
    <section class="card" aria-labelledby="wish-label">
      <label id="wish-label" for="wish">帰ってきたら、したいこと</label>
      <input id="wish" maxlength="42" placeholder="例：家族で海を見に行く" autocomplete="off">
      <p class="hint">声を30秒以内で録音します。録音はこの端末のこの画面だけで使われ、外部には送信されません。</p>
      <div class="record-row">
        <button class="round" id="record" type="button" aria-label="録音を開始">●</button>
        <div class="record-copy"><strong id="record-title">声を預ける</strong><span id="record-sub">タップして録音を開始</span></div>
      </div>
      <div class="return-row">
        <button class="return" id="return" type="button" disabled>スマホを振って、帰還を呼ぶ</button>
        <button class="fallback" id="fallback" type="button" disabled>落とす</button>
      </div>
      <p class="status" id="status" aria-live="polite">まず、未来の自分へ声を預けてください。</p>
      <div class="returned" id="returned" aria-live="polite">
        <p id="returned-copy">帰還カプセルを受信しました。</p>
        <button class="play" id="play" type="button">未来から届いた声を聴く</button>
      </div>
    </section>
    <footer>小惑星 25143 Itokawa から地球へ戻った微粒子のように、いまのあなたの声を、いつかのあなたへ。</footer>
  </main>
  <script>
    (() => {
      const record = document.querySelector('#record');
      const recordTitle = document.querySelector('#record-title');
      const recordSub = document.querySelector('#record-sub');
      const returnButton = document.querySelector('#return');
      const fallback = document.querySelector('#fallback');
      const status = document.querySelector('#status');
      const capsule = document.querySelector('#capsule');
      const returned = document.querySelector('#returned');
      const returnedCopy = document.querySelector('#returned-copy');
      const play = document.querySelector('#play');
      const wish = document.querySelector('#wish');
      let recorder, chunks = [], audioUrl = '', audio, isRecording = false, returnedOnce = false;

      function setStatus(text) { status.textContent = text; }
      function updateReturn() { const ready = Boolean(audioUrl); returnButton.disabled = !ready; fallback.disabled = !ready; }
      function stopTracks(stream) { stream.getTracks().forEach(track => track.stop()); }
      function endRecording() { if (recorder && recorder.state === 'recording') recorder.stop(); }
      async function startRecording() {
        if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { setStatus('このブラウザでは録音を利用できません。ChromeまたはSafariで開いてください。'); return; }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
          chunks = []; recorder = new MediaRecorder(stream);
          recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
          recorder.onstop = () => {
            stopTracks(stream); isRecording = false; record.classList.remove('is-recording'); record.setAttribute('aria-label','録音を開始');
            const blob = new Blob(chunks,{type:recorder.mimeType || 'audio/webm'});
            if (audioUrl) URL.revokeObjectURL(audioUrl); audioUrl = URL.createObjectURL(blob); audio = new Audio(audioUrl);
            recordTitle.textContent = '声を預けました'; recordSub.textContent = '準備ができたら、スマホを振ってください。'; setStatus('帰還カプセルは発射準備完了です。'); updateReturn();
          };
          recorder.start(); isRecording = true; record.classList.add('is-recording'); record.setAttribute('aria-label','録音を終了'); recordTitle.textContent = '録音中'; recordSub.textContent = 'もう一度タップすると、声を預けます。'; setStatus('録音中です。30秒以内で話してください。');
          setTimeout(() => { if (isRecording) { endRecording(); setStatus('30秒の録音を預かりました。'); } }, 30000);
        } catch (_) { setStatus('マイクが許可されませんでした。ブラウザの設定からマイクを許可してください。'); }
      }
      async function returnCapsule() {
        if (!audioUrl || returnedOnce) return;
        returnedOnce = true; capsule.classList.add('arrived'); returnButton.disabled = true; fallback.disabled = true;
        const label = wish.value.trim() ? `「${wish.value.trim()}」という願い` : 'あなたの願い';
        setStatus('地球に向けて、帰還カプセルが落下しています…');
        setTimeout(() => { returned.classList.add('show'); returnedCopy.textContent = `${label}を預けた声が、未来から帰ってきました。`; setStatus('帰還成功。声を聴いてください。'); }, 1050);
      }
      async function requestShake() {
        if (!audioUrl) return;
        try {
          if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            const result = await DeviceMotionEvent.requestPermission(); if (result !== 'granted') throw new Error('denied');
          }
          let last = 0;
          window.addEventListener('devicemotion', event => {
            const a = event.accelerationIncludingGravity; if (!a || returnedOnce) return;
            const force = Math.abs(a.x || 0)+Math.abs(a.y || 0)+Math.abs(a.z || 0);
            if (force > 30 && Date.now()-last > 900) { last = Date.now(); returnCapsule(); }
          }, {once:false});
          setStatus('端末を軽く一度振ってください。反応しない場合は「落とす」を押してください。');
        } catch (_) { setStatus('端末の動きを使えないため、「落とす」を押して帰還させてください。'); }
      }
      record.addEventListener('click', () => isRecording ? endRecording() : startRecording());
      returnButton.addEventListener('click', requestShake);
      fallback.addEventListener('click', returnCapsule);
      play.addEventListener('click', async () => { if (!audio) return; audio.currentTime = 0; try { await audio.play(); } catch (_) { setStatus('再生できませんでした。もう一度押してください。'); } });
      window.addEventListener('beforeunload', () => { if (audioUrl) URL.revokeObjectURL(audioUrl); });
    })();
  </script>
</body>
</html>
